# QGIS Ribbon: ribbon definition of the print layout window.
# Same format as ribbon_arcgis.yaml. Labels and descriptions in English; German texts in
# qgis_ribbon/i18n/de_ribbon_layout.json. Read and checked by qgis_ribbon/core/config_loader.py.

version: 1

hide_toolbars: ["mLayoutToolbar", "mToolsToolbar", "mNavigationToolbar", "mActionsToolbar", "mAtlasToolbar", "mReportToolbar"]

quick_access: ["projekt_speichern", "rueckgaengig", "wiederholen"]

tabs:
  - id: "layout"
    label: "Layout"
    groups:
      - id: "zwischenablage"
        label: "Clipboard"
        items:
          - {command: "einfuegen", size: "large"}
          - {command: "an_ort_einfuegen", size: "medium"}
          - {command: "ausschneiden", size: "medium"}
          - {command: "kopieren", size: "medium"}
          - {command: "element_loeschen", size: "large"}
      - id: "navigieren"
        label: "Navigate"
        items:
          - {command: "layout_verschieben", size: "large"}
          - {command: "zoom_werkzeug", size: "large"}
          - {command: "ganze_seite", size: "medium"}
          - {command: "zoom_100", size: "medium"}
          - {command: "auf_breite", size: "medium"}
          - {command: "layout_hineinzoomen", size: "medium"}
          - {command: "layout_herauszoomen", size: "medium"}
          - {command: "ansicht_aktualisieren", size: "medium"}
      - id: "auswahl"
        label: "Selection"
        items:
          - {command: "element_auswaehlen", size: "large"}
          - {command: "inhalt_verschieben", size: "medium"}
          - {command: "knoten_bearbeiten", size: "medium"}
          - {command: "alle_auswaehlen", size: "medium"}
          - {command: "auswahl_aufheben", size: "medium"}
          - {command: "auswahl_umkehren", size: "medium"}
          - {command: "naechstes_darunter", size: "medium"}
          - {command: "naechstes_darueber", size: "medium"}
      - id: "seite"
        label: "Page"
        items:
          - {command: "seiten_hinzufuegen", size: "large"}
          - {command: "seitengroesse", size: "large"}
          - {command: "seiteneigenschaften", size: "medium"}
          - {command: "layouteigenschaften", size: "medium"}
          - {command: "druckseite", size: "medium"}
      - id: "verwalten"
        label: "Layout"
        items:
          - {command: "layout_oeffnen", size: "large"}
          - {command: "layout_umbenennen", size: "medium"}
          - {command: "layout_duplizieren", size: "medium"}
          - {command: "layout_loeschen", size: "medium"}
          - {command: "layoutverwaltung", size: "medium"}
          - {command: "fenster_schliessen", size: "medium"}
  - id: "einfuegen"
    label: "Insert"
    groups:
      - id: "layout"
        label: "Layout"
        items:
          - split: "layout_neu"
            items: ["neues_layout_a4_quer", "neues_layout_a4_hoch", "neues_layout_a3_quer", "neues_layout_a3_hoch"]
            size: "large"
          - {command: "neu_aus_vorlage_layout", size: "large"}
          - {command: "aus_vorlage", size: "large"}
      - id: "kartenrahmen"
        label: "Map Frame"
        items:
          - {command: "element_karte", size: "large"}
          - {command: "element_karte_3d", size: "large"}
      - id: "kartenelemente"
        label: "Map Elements"
        items:
          - {command: "element_legende", size: "large"}
          - {command: "element_massstab", size: "large"}
          - {command: "element_nordpfeil", size: "large"}
          - {command: "element_hoehenprofil", size: "large"}
      - id: "tabellen"
        label: "Tables"
        items:
          - {command: "element_attributtabelle", size: "large"}
          - {command: "element_feste_tabelle", size: "medium"}
          - {command: "element_html", size: "medium"}
      - id: "grafik_text"
        label: "Graphics and Text"
        items:
          - {command: "element_text", size: "large"}
          - {command: "element_dynamischer_text", size: "large"}
          - {command: "element_bild", size: "large"}
          - menu: "Shape"
            key: "Form"
            icon: "/mActionAddBasicShape.svg"
            items: ["element_rechteck", "element_ellipse", "element_dreieck"]
            size: "large"
          - menu: "Node Item"
            key: "Knotenelement"
            icon: "/mActionAddNodesItem.svg"
            items: ["element_polygon", "element_polylinie"]
            size: "large"
          - {command: "element_markierung", size: "medium"}
          - {command: "element_pfeil", size: "medium"}
  - id: "atlas"
    label: "Atlas"
    visible_when: ["layout_is_print"]
    groups:
      - id: "atlas"
        label: "Atlas"
        items:
          - {command: "atlas_einstellungen", size: "large"}
          - {command: "atlas_vorschau", size: "large"}
      - id: "blaettern"
        label: "Browse"
        items:
          - {command: "atlas_erstes", size: "medium"}
          - {command: "atlas_zurueck", size: "medium"}
          - {command: "atlas_objekt", size: "medium"}
          - {command: "atlas_weiter", size: "medium"}
          - {command: "atlas_letztes", size: "medium"}
      - id: "ausgabe"
        label: "Output"
        items:
          - {command: "atlas_export_pdf", size: "large"}
          - {command: "atlas_export_bilder", size: "medium"}
          - {command: "atlas_export_svg", size: "medium"}
          - {command: "atlas_drucken", size: "medium"}
  - id: "bericht"
    label: "Report"
    visible_when: ["layout_is_report"]
    groups:
      - id: "aufbau"
        label: "Report"
        items:
          - {command: "bericht_einstellungen", size: "large"}
          - {command: "panel_bericht", size: "large"}
      - id: "ausgabe"
        label: "Output"
        items:
          - {command: "bericht_export_pdf", size: "large"}
          - {command: "bericht_export_bild", size: "medium"}
          - {command: "bericht_export_svg", size: "medium"}
          - {command: "bericht_drucken", size: "medium"}
  - id: "ansicht"
    label: "View"
    groups:
      - id: "bedienfelder"
        label: "Panels"
        items:
          - {command: "panel_element", size: "large"}
          - {command: "panel_layout", size: "medium"}
          - {command: "panel_elemente", size: "medium"}
          - {command: "panel_fuehrungen", size: "medium"}
          - {command: "panel_atlas", size: "medium"}
          - {command: "panel_verlauf", size: "medium"}
      - id: "anzeigen"
        label: "Display"
        items:
          - {command: "lineale", size: "medium"}
          - {command: "gitter", size: "medium"}
          - {command: "fuehrungen", size: "medium"}
          - {command: "rahmen", size: "medium"}
          - {command: "seiten", size: "medium"}
      - id: "einrasten"
        label: "Snapping"
        items:
          - {command: "am_gitter", size: "medium"}
          - {command: "an_fuehrungen", size: "medium"}
          - {command: "schlaue_fuehrungen", size: "medium"}
          - {command: "fuehrungen_verwalten", size: "medium"}
          - {command: "fuehrungen_loeschen", size: "medium"}
      - id: "vorschau"
        label: "Preview"
        items:
          - {command: "vorschau", size: "large"}
      - id: "fenster"
        label: "Window"
        items:
          - {command: "zum_hauptfenster", size: "large"}
          - {command: "vollbild", size: "medium"}
          - {command: "panels_umschalten", size: "medium"}
      - id: "einstellungen"
        label: "Settings"
        items:
          - {command: "layoutoptionen", size: "medium"}
          - {command: "tastenkuerzel", size: "medium"}
  - id: "teilen"
    label: "Share"
    visible_when: ["layout_is_print"]
    groups:
      - id: "exportieren"
        label: "Export"
        items:
          - {command: "export_pdf", size: "large"}
          - {command: "export_bild", size: "large"}
          - {command: "export_svg", size: "large"}
      - id: "drucken"
        label: "Print"
        items:
          - {command: "layout_drucken", size: "large"}
          - {command: "druckseite", size: "medium"}
      - id: "vorlage"
        label: "Template"
        items:
          - {command: "als_vorlage", size: "large"}
  - {id: "erweiterungen", label: "Extensions", dynamic: "erweiterungen"}

contextual_tabs:
  - id: "layout_format"
    label: "Format"
    context: "Item"
    visible_when: ["layout_items_selected"]
    groups:
      - id: "anordnen"
        label: "Arrange"
        launcher: "item_optionen"
        items:
          - {command: "nach_vorn", size: "medium"}
          - {command: "eine_ebene_hoeher", size: "medium"}
          - {command: "eine_ebene_tiefer", size: "medium"}
          - {command: "nach_hinten", size: "medium"}
          - {command: "gruppieren", size: "medium"}
          - {command: "gruppe_aufloesen", size: "medium"}
          - {command: "fixieren", size: "medium"}
          - {command: "alle_loesen", size: "medium"}
      - id: "ausrichten"
        label: "Align"
        items:
          - menu: "Align"
            key: "Ausrichten"
            icon: "/mActionAlignLeft.svg"
            items: ["ausrichten_links", "ausrichten_mitte_h", "ausrichten_rechts", "ausrichten_oben", "ausrichten_mitte_v", "ausrichten_unten"]
            size: "large"
          - menu: "Distribute"
            key: "Verteilen"
            icon: "/mActionDistributeHSpace.svg"
            items: ["verteilen_links", "verteilen_mitte_h", "verteilen_rechts", "verteilen_abstand_h", "verteilen_oben", "verteilen_mitte_v", "verteilen_unten", "verteilen_abstand_v"]
            size: "large"
          - menu: "Match Size"
            key: "Groesse angleichen"
            icon: "/mActionResizeWidest.svg"
            items: ["angleichen_breiteste", "angleichen_schmalste", "angleichen_hoechste", "angleichen_niedrigste", "angleichen_quadrat"]
            size: "large"
      - id: "groesse_position"
        label: "Size and Position"
        items:
          - {command: "item_x", size: "medium"}
          - {command: "item_y", size: "medium"}
          - {command: "item_bezugspunkt", size: "medium"}
          - {command: "item_breite", size: "medium"}
          - {command: "item_hoehe", size: "medium"}
          - {command: "item_drehung", size: "medium"}
      - id: "rahmen"
        label: "Frame"
        items:
          - {command: "item_rahmen", size: "medium"}
          - {command: "item_rahmenfarbe", size: "medium"}
          - {command: "item_rahmenstaerke", size: "medium"}
      - id: "hintergrund"
        label: "Background"
        items:
          - {command: "item_hintergrund", size: "medium"}
          - {command: "item_hintergrundfarbe", size: "medium"}
      - id: "darstellung"
        label: "Appearance"
        items:
          - {command: "item_deckkraft", size: "medium"}
          - {command: "item_mischmodus", size: "medium"}
  - id: "layout_karte"
    label: "Map"
    context: "Item"
    visible_when: ["layout_item_is_map"]
    groups:
      - id: "massstab"
        label: "Scale and Rotation"
        launcher: "item_optionen"
        items:
          - {command: "item_karte_massstab", size: "medium"}
          - {command: "item_karte_drehung", size: "medium"}
      - id: "ausdehnung"
        label: "Extent"
        items:
          - {command: "item_karte_von_hauptkarte", size: "large"}
          - {command: "item_karte_auf_hauptkarte", size: "medium"}
          - {command: "item_karte_lesezeichen", size: "medium"}
          - {command: "inhalt_verschieben", size: "medium"}
      - id: "layer"
        label: "Layers"
        items:
          - {command: "item_karte_thema", size: "large"}
          - {command: "item_karte_layer_sperren", size: "medium"}
          - {command: "item_karte_stile_sperren", size: "medium"}
      - id: "weiteres"
        label: "More"
        items:
          - {command: "item_karte_aktualisieren", size: "large"}
          - {command: "item_karte_gitter", size: "large"}
  - id: "layout_text"
    label: "Text"
    context: "Item"
    visible_when: ["layout_item_is_label"]
    groups:
      - id: "inhalt"
        label: "Content"
        launcher: "item_optionen"
        items:
          - {command: "item_text_dynamisch", size: "large"}
          - {command: "item_text_inhalt", size: "medium"}
      - id: "schrift"
        label: "Font"
        items:
          - {command: "item_text_schrift", size: "medium"}
          - {command: "item_text_groesse", size: "medium"}
          - {command: "item_text_farbe", size: "medium"}
      - id: "ausrichtung"
        label: "Alignment"
        items:
          - {command: "item_text_horizontal", size: "medium"}
          - {command: "item_text_vertikal", size: "medium"}
  - id: "layout_legende"
    label: "Legend"
    context: "Item"
    visible_when: ["layout_item_is_legend"]
    groups:
      - id: "karte"
        label: "Map"
        launcher: "item_optionen"
        items:
          - {command: "item_legende_karte", size: "medium"}
          - {command: "item_legende_auto", size: "medium"}
          - {command: "item_legende_filter", size: "medium"}
      - id: "aufbau"
        label: "Layout"
        items:
          - {command: "item_legende_titel", size: "medium"}
          - {command: "item_legende_spalten", size: "medium"}
          - {command: "item_legende_anpassen", size: "medium"}
  - id: "layout_massstab"
    label: "Scale Bar"
    context: "Item"
    visible_when: ["layout_item_is_scalebar"]
    groups:
      - id: "karte"
        label: "Map"
        launcher: "item_optionen"
        items:
          - {command: "item_massstab_karte", size: "medium"}
          - {command: "item_massstab_stil", size: "medium"}
      - id: "einteilung"
        label: "Segments"
        items:
          - {command: "item_massstab_einheit", size: "medium"}
          - {command: "item_massstab_segmente", size: "medium"}
          - {command: "item_massstab_laenge", size: "medium"}
      - id: "schrift"
        label: "Font"
        items:
          - {command: "item_massstab_schrift", size: "medium"}
  - id: "layout_bild"
    label: "Picture"
    context: "Item"
    visible_when: ["layout_item_is_picture"]
    groups:
      - id: "quelle"
        label: "Source"
        launcher: "item_optionen"
        items:
          - {command: "item_bild_quelle", size: "medium"}
      - id: "groesse"
        label: "Size"
        items:
          - {command: "item_bild_modus", size: "medium"}
          - {command: "item_bild_anker", size: "medium"}
      - id: "drehung"
        label: "Rotation"
        items:
          - {command: "item_bild_karte", size: "medium"}
  - id: "layout_form"
    label: "Shape"
    context: "Item"
    visible_when: ["layout_item_is_shape"]
    groups:
      - id: "stil"
        label: "Style"
        launcher: "item_optionen"
        items:
          - {command: "item_form_symbol", size: "medium"}
      - id: "form"
        label: "Shape"
        items:
          - {command: "item_form_typ", size: "medium"}
          - {command: "item_form_radius", size: "medium"}
          - {command: "knoten_bearbeiten", size: "medium"}
  - id: "layout_tabelle"
    label: "Table"
    context: "Item"
    visible_when: ["layout_item_is_table"]
    groups:
      - id: "daten"
        label: "Data"
        launcher: "item_optionen"
        items:
          - {command: "item_tabelle_attribute", size: "large"}
          - {command: "item_tabelle_layer", size: "medium"}
      - id: "zeilen"
        label: "Rows"
        items:
          - {command: "item_tabelle_zeilen", size: "medium"}
          - {command: "item_tabelle_filter", size: "medium"}
          - {command: "item_tabelle_nur_karte", size: "medium"}

commands:
  projekt_speichern:
    label: "Save Project"
    source: {type: "designer_action", object_name: "mActionSaveProject"}
    description: "Save the project with all its layouts."
  rueckgaengig:
    label: "Undo"
    source: {type: "designer_edit", role: "undo"}
    description: "Undo the last change in this layout."
  wiederholen:
    label: "Redo"
    source: {type: "designer_edit", role: "redo"}
    description: "Redo the change that was undone last."
  einfuegen:
    label: "Paste"
    source: {type: "designer_edit", role: "paste"}
    description: "Paste the copied items at the mouse position."
  an_ort_einfuegen:
    label: "Paste in Place"
    source: {type: "designer_action", object_name: "mActionPasteInPlace"}
    description: "Paste the copied items at their original position."
  ausschneiden:
    label: "Cut"
    source: {type: "designer_edit", role: "cut"}
    description: "Cut the selected items."
  kopieren:
    label: "Copy"
    source: {type: "designer_edit", role: "copy"}
    description: "Copy the selected items."
  element_loeschen:
    label: "Delete"
    source: {type: "designer_action", object_name: "mActionDeleteSelection"}
    description: "Delete the selected items."
  layout_verschieben:
    label: "Pan"
    source: {type: "designer_action", object_name: "mActionPan"}
    description: "Move the view of the layout with the mouse."
  zoom_werkzeug:
    label: "Zoom"
    source: {type: "designer_action", object_name: "mActionZoomTool"}
    description: "Zoom to an area drawn with the mouse."
  ganze_seite:
    label: "Full Page"
    source: {type: "designer_action", object_name: "mActionZoomAll"}
    description: "Zoom to the whole layout."
  zoom_100:
    label: "100%"
    source: {type: "designer_action", object_name: "mActionZoomActual"}
    description: "Show the layout at its actual size."
  auf_breite:
    label: "Page Width"
    source: {type: "designer_action", object_name: "mActionZoomToWidth"}
    description: "Zoom so that the page fills the width of the window."
  layout_hineinzoomen:
    label: "Zoom In"
    source: {type: "designer_action", object_name: "mActionZoomIn"}
    description: "Zoom in one step."
  layout_herauszoomen:
    label: "Zoom Out"
    source: {type: "designer_action", object_name: "mActionZoomOut"}
    description: "Zoom out one step."
  ansicht_aktualisieren:
    label: "Refresh"
    source: {type: "designer_action", object_name: "mActionRefreshView"}
    description: "Redraw the layout with its current data."
  element_auswaehlen:
    label: "Select"
    source: {type: "designer_action", object_name: "mActionSelectMoveItem"}
    description: "Select items and move or resize them with the mouse."
  inhalt_verschieben:
    label: "Move Content"
    source: {type: "designer_action", object_name: "mActionMoveItemContent"}
    description: "Move the content of an item, e.g. the map inside its frame."
  knoten_bearbeiten:
    label: "Edit Nodes"
    source: {type: "designer_action", object_name: "mActionEditNodesItem"}
    description: "Move, add or delete the nodes of a polygon or polyline."
  alle_auswaehlen:
    label: "Select All"
    source: {type: "designer_action", object_name: "mActionSelectAll"}
    description: "Select all items of the layout."
  auswahl_aufheben:
    label: "Deselect All"
    source: {type: "designer_action", object_name: "mActionDeselectAll"}
    description: "Clear the selection."
  auswahl_umkehren:
    label: "Invert Selection"
    source: {type: "designer_action", object_name: "mActionInvertSelection"}
    description: "Select the items that are not selected, and deselect the others."
  naechstes_darunter:
    label: "Next Below"
    source: {type: "designer_action", object_name: "mActionSelectNextBelow"}
    description: "Select the next item below the current one."
  naechstes_darueber:
    label: "Next Above"
    source: {type: "designer_action", object_name: "mActionSelectNextAbove"}
    description: "Select the next item above the current one."
  seiten_hinzufuegen:
    label: "Add Pages"
    source: {type: "designer_action", object_name: "mActionAddPages"}
    description: "Add pages to the layout."
  seitengroesse:
    label: "Page Size"
    source: {type: "custom", id: "ribbon.seite_groesse"}
    description: "Set the size and orientation of the current page."
  seiteneigenschaften:
    label: "Page Properties"
    source: {type: "designer_action", object_name: "mActionPageProperties"}
    description: "Set the size and the background of the current page."
  layouteigenschaften:
    label: "Layout Properties"
    source: {type: "designer_action", object_name: "mActionLayoutProperties"}
    description: "Show the general settings of the layout, such as resolution and grid."
  druckseite:
    label: "Page Setup"
    source: {type: "designer_action", object_name: "mActionPageSetup"}
    description: "Set the paper and the margins for printing."
  layout_oeffnen:
    label: "Layouts"
    source: {type: "qgis_menu", object_name: "mLayoutsMenu"}
    description: "Open one of the print layouts of the project."
  layout_umbenennen:
    label: "Rename"
    source: {type: "designer_action", object_name: "mActionRenameLayout"}
    description: "Rename this layout."
  layout_duplizieren:
    label: "Duplicate"
    source: {type: "designer_action", object_name: "mActionDuplicateLayout"}
    description: "Create a copy of this layout."
  layout_loeschen:
    label: "Delete Layout"
    source: {type: "designer_action", object_name: "mActionRemoveLayout"}
    description: "Delete this layout from the project."
  layoutverwaltung:
    label: "Layout Manager"
    source: {type: "designer_action", object_name: "mActionLayoutManager"}
    description: "Open the layout manager: create layouts from templates (.qpt), open and manage them."
  fenster_schliessen:
    label: "Close Window"
    source: {type: "designer_action", object_name: "mActionClose"}
    description: "Close this window. The layout stays in the project."
  layout_neu:
    label: "New Layout"
    source: {type: "designer_action", object_name: "mActionNewLayout"}
    description: "Create a new print layout."
  neues_layout_a4_quer:
    label: "A4 Landscape"
    source: {type: "custom", id: "ribbon.neues_layout_seite", args: ["A4", "landscape"]}
    description: "Create a new print layout with a landscape A4 page."
  neues_layout_a4_hoch:
    label: "A4 Portrait"
    source: {type: "custom", id: "ribbon.neues_layout_seite", args: ["A4", "portrait"]}
    description: "Create a new print layout with a portrait A4 page."
  neues_layout_a3_quer:
    label: "A3 Landscape"
    source: {type: "custom", id: "ribbon.neues_layout_seite", args: ["A3", "landscape"]}
    description: "Create a new print layout with a landscape A3 page."
  neues_layout_a3_hoch:
    label: "A3 Portrait"
    source: {type: "custom", id: "ribbon.neues_layout_seite", args: ["A3", "portrait"]}
    description: "Create a new print layout with a portrait A3 page."
  neu_aus_vorlage_layout:
    label: "Layout from Template"
    source: {type: "custom", id: "ribbon.layout_aus_vorlage"}
    description: "Create a new print layout from a template (.qpt)."
  aus_vorlage:
    label: "Add from Template"
    source: {type: "designer_action", object_name: "mActionLoadFromTemplate"}
