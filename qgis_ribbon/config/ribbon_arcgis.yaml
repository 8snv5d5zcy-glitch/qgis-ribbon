# QGIS Ribbon: ribbon definition (tabs, groups, commands, conditions, galleries).
# Labels and descriptions in English; German texts in qgis_ribbon/i18n/de_ribbon.json.
# Read and checked by qgis_ribbon/core/config_loader.py.

version: 1

hide_toolbars: ["mFileToolBar", "mLayerToolBar", "mDigitizeToolBar", "mAdvancedDigitizeToolBar", "mMapNavToolBar", "mAttributesToolBar", "mHelpToolBar", "mLabelToolBar", "mSnappingToolBar", "mDataSourceManagerToolBar", "mShapeDigitizeToolBar", "mSelectionToolBar", "mMeshToolBar", "mAnnotationsToolBar", "mGpsToolBar"]

extensions:
  menus: ["mPluginMenu", "mRasterMenu", "mVectorMenu", "mDatabaseMenu", "mWebMenu"]
  toolbars: ["mPluginToolBar", "mRasterToolBar", "mVectorToolBar", "mDatabaseToolBar", "mWebToolBar"]
  qgis_toolbars: ["mFileToolBar", "mLayerToolBar", "mDigitizeToolBar", "mAdvancedDigitizeToolBar", "mMapNavToolBar", "mAttributesToolBar", "mHelpToolBar", "mLabelToolBar", "mSnappingToolBar", "mDataSourceManagerToolBar", "mShapeDigitizeToolBar", "mSelectionToolBar", "mMeshToolBar", "mAnnotationsToolBar", "mGpsToolBar", "mBookmarkToolbar", "mBrowserToolbar", "mToolbar", "processingToolbar"]
  hide: true

quick_access: ["neues_projekt", "projekt_oeffnen", "projekt_speichern", "rueckgaengig", "wiederholen", "erkunden", "hineinzoomen", "suchen"]

tabs:
  - id: "karte"
    label: "Map"
    groups:
      - id: "zwischenablage"
        label: "Clipboard"
        items:
          - split: "einfuegen"
            items: ["einfuegen_als", "stil_einfuegen"]
            size: "large"
          - {command: "ausschneiden", size: "medium"}
          - {command: "kopieren", size: "medium"}
          - {command: "pfad_kopieren", size: "large"}
      - id: "navigieren"
        label: "Navigate"
        launcher: "optionen_kartenwerkzeuge"
        items:
          - split: "erkunden"
            items: ["abfrage_oberster_layer", "abfrage_sichtbare_layer", "abfragbare_layer", "abfrage_aktueller_layer"]
            size: "large"
          - row: ["volle_ausdehnung", "schrittweise_hineinzoomen", "schrittweise_herauszoomen", "vorherige_ausdehnung", "naechste_ausdehnung"]
          - menu: "Bookmarks"
            key: "Lesezeichen"
            icon: "/mActionShowBookmarks.svg"
            gallery: "lesezeichen_galerie"
            items: ["neues_lesezeichen", "lesezeichen_verwalten"]
            size: "large"
          - {command: "gehe_zu_xy", size: "large"}
      - id: "layer"
        label: "Layer"
        items:
          - {command: "grundkarten_galerie", size: "large"}
          - split: "daten_hinzufuegen"
            items: ["layer_hinzufuegen"]
            size: "large"
          - {command: "vektorlayer_hinzufuegen", size: "medium"}
          - {command: "xy_tabelle_zu_punkten", size: "medium"}
          - {command: "neuer_annotationslayer", size: "large"}
      - id: "auswahl"
        label: "Selection"
        launcher: "auswahloptionen"
        items:
          - split: "rechteck"
            label: "Select"
            items: ["rechteck", "polygon", "freihand", "kreis", "auswahl_linie"]
            size: "large"
          - {command: "nach_attributen", size: "large"}
          - {command: "nach_lage", size: "large"}
          - {command: "attribute", size: "medium"}
          - {command: "auswahl_aufheben", size: "medium"}
          - {command: "zur_auswahl_zoomen", size: "medium"}
      - id: "abfragen"
        label: "Query"
        items:
          - split: "messen"
            items: ["messwerkzeuge"]
            size: "large"
          - split: "suchen"
            items: ["sucheinstellungen"]
            size: "large"
      - id: "beschriftung"
        label: "Labeling"
        items:
          - row: ["nicht_platzierte_beschriftungen"]
          - {command: "beschriftungen_extrahieren", size: "large"}
          - row: ["beschriftungen_ein_aus", "beschriftungen_anpinnen", "angepinnte_hervorheben"]
          - row: ["beschriftung_verschieben", "beschriftung_drehen", "beschriftung_aendern"]
  - id: "einfuegen"
    label: "Insert"
    groups:
      - id: "projekt"
        label: "Project"
        items:
          - {command: "neue_kartenansicht", size: "large"}
          - {command: "neues_layout", size: "large"}
          - {command: "neuer_bericht", size: "large"}
          - {command: "werkzeuge", size: "medium"}
          - {command: "layerdefinition_laden", size: "medium"}
          - {command: "layoutverwaltung", size: "medium"}
          - menu: "Connections"
            key: "Verbindungen"
            icon: "/mActionAddLayer.svg"
            items:
              - "postgresql_verbindung"
              - menu: "Server"
                key: "Server"
                items: ["arcgis_rest_server", "wfs_ogc_api", "wcs_server", "wms_wmts_server"]
              - "stac_verbindung"
            size: "large"
          - {command: "ordner_verbinden", size: "large"}
      - id: "neue_layer"
        label: "New Layers"
        items:
          - split: "neuer_geopackage_layer"
            label: "New Layer"
            items: ["neuer_geopackage_layer", "neuer_shapefile_layer", "neuer_scratch_layer", "neuer_spatialite_layer", "neuer_virtueller_layer"]
            size: "large"
      - id: "stile"
        label: "Styles"
        items:
          - {command: "stilverwaltung", size: "medium"}
      - id: "favoriten"
        label: "Favorites"
        items:
          - {command: "favoriten", size: "medium"}
  - id: "analyse"
    label: "Analysis"
    groups:
      - id: "geoverarbeitung"
        label: "Geoprocessing"
        launcher: "processing_optionen"
        items:
          - {command: "verlauf", size: "large"}
          - {command: "modell_designer", size: "medium"}
          - {command: "python", size: "medium"}
          - {command: "umgebungen", size: "medium"}
          - {command: "werkzeuge", size: "large"}
      - id: "werkzeuge"
        label: "Tools"
        items:
          - menu: "Analysis Tools"
            key: "Analysewerkzeuge"
            icon: "/processingAlgorithm.svg"
            gallery: "processing_galerie"
            items: ["analyse_galerie_anpassen"]
            size: "large"
  - id: "ansicht"
    label: "View"
    groups:
      - id: "verknuepfen"
        label: "Link"
        items:
          - {command: "neue_kartenansicht", size: "large"}
      - id: "fenster"
        label: "Windows"
        items:
          - {command: "katalog", size: "large"}
          - {command: "inhalt", size: "large"}
          - {command: "geoverarbeitung", size: "large"}
          - {command: "python_konsole", size: "large"}
      - id: "barrierefreiheit"
        label: "Accessibility"
        items:
          - split: "farbsehschwaeche_simulieren"
            items: ["vorschau_deuteranopie"]
            size: "large"
      - id: "navigation"
        label: "Navigation"
        items:
          - {command: "kartendrehung", size: "large"}
          - {command: "lupe", size: "large"}
  - id: "bearbeiten"
    label: "Edit"
    activate_on: ["editing_started"]
    groups:
      - id: "zwischenablage"
        label: "Clipboard"
        items:
          - split: "einfuegen"
            items: ["einfuegen_als", "stil_einfuegen"]
            size: "large"
          - {command: "ausschneiden", size: "medium"}
          - {command: "kopieren", size: "medium"}
          - {command: "pfad_kopieren", size: "large"}
      - id: "bearbeitung"
        label: "Editing"
        items:
          - {command: "bearbeiten", size: "large"}
          - {command: "layeraenderungen_speichern", size: "large"}
          - {command: "layeraenderungen_verwerfen", size: "large"}
          - {command: "aenderungen_speichern", size: "medium"}
          - {command: "aenderungen_verwerfen", size: "medium"}
          - {command: "topologisch_bearbeiten", size: "medium"}
          - {command: "einstellungen", size: "medium"}
      - id: "einrasten"
        label: "Snapping"
        items:
          - split: "einrasten"
            items: ["einrastoptionen"]
            size: "large"
          - row: ["spurverfolgung", "selbsteinrasten", "schnittpunkte_einrasten"]
      - id: "konstruktion"
        label: "Construction"
        items:
          - {command: "erweiterte_digitalisierung", size: "large"}
          - {command: "konstruktionspanel", size: "medium"}
      - id: "objekte"
        label: "Features"
        items:
          - {command: "erstellen", size: "large"}
          - {command: "aendern", size: "large"}
          - {command: "loeschen", size: "large"}
      - id: "auswahl"
        label: "Selection"
        launcher: "auswahloptionen"
        items:
          - split: "rechteck"
            label: "Select"
            items: ["rechteck", "polygon", "freihand", "kreis", "auswahl_linie"]
            size: "large"
          - {command: "attribute", size: "medium"}
          - {command: "auswahl_aufheben", size: "medium"}
          - {command: "zur_auswahl_zoomen", size: "medium"}
      - id: "werkzeuge"
        label: "Tools"
        launcher: "digitalisieroptionen"
        items:
          - menu: "Editing Tools"
            key: "Editorwerkzeuge"
            icon: "/mActionVertexTool.svg"
            gallery: "editor_galerie"
            items: ["galerie_groesse", "alle_werkzeuge", "editor_galerie_anpassen"]
            size: "large"
      - id: "hoehe"
        label: "Elevation"
        items:
          - {command: "z_wert", size: "large"}
  - id: "bilddaten"
    label: "Imagery"
    groups:
      - id: "ausrichten"
        label: "Align"
        items:
          - {command: "georeferenzieren", size: "large"}
          - {command: "raster_transformieren", size: "large"}
          - {command: "raster_anpassen", size: "large"}
      - id: "analyse"
        label: "Analysis"
        items:
          - {command: "rasterrechner", size: "large"}
  - id: "teilen"
    label: "Share"
    groups:
      - id: "paket"
        label: "Package"
        items:
          - {command: "layer_verpacken", size: "large"}
      - id: "speichern_als"
        label: "Save As"
        items:
          - {command: "projekt_speichern_als", size: "large"}
          - {command: "layerdatei_speichern", size: "large"}
      - id: "ausgabe"
        label: "Output"
        items:
          - split: "karte_exportieren"
            items: ["karte_als_pdf", "projekt_als_dxf"]
            size: "large"
          - split: "layout_exportieren"
            items: ["layout_als_bild", "atlas_als_pdf"]
            size: "large"
          - {command: "drucken", size: "large"}
  - {id: "erweiterungen", label: "Extensions", dynamic: "erweiterungen"}

contextual_tabs:
  - id: "vektor_darstellung"
    label: "Appearance"
    context: "Vector Layer"
    visible_when: ["active_layer_is_vector"]
    groups:
      - id: "sichtbarkeitsbereich"
        label: "Visibility Range"
        items:
          - {command: "layer_massstab_schalten", size: "large"}
          - {command: "layer_massstab_max", size: "medium"}
          - {command: "layer_massstab_min", size: "medium"}
      - id: "effekte"
        label: "Effects"
        items:
          - {command: "layer_deckkraft", size: "medium"}
          - {command: "layer_mischmodus", size: "medium"}
      - id: "zeichnen"
        label: "Drawing"
        items:
          - split: "symbolisierung"
            items: ["renderer_galerie"]
            size: "large"
          - {command: "masken", size: "medium"}
          - {command: "stil_importieren", size: "medium"}
  - id: "vektor_beschriftung"
    label: "Labeling"
    context: "Vector Layer"
    visible_when: ["active_layer_is_vector"]
    groups:
      - id: "layer"
        label: "Layer"
        items:
          - {command: "beschriftung_schalten", size: "large"}
      - id: "beschriftungsklasse"
        label: "Label Class"
        items:
          - row: ["beschriftungsklasse", "beschriftungsklasse_neu", "beschriftungsklasse_loeschen", "beschriftungsklasse_filter", "beschriftungsklasse_aktiv", "beschriftungsfeld"]
      - id: "sichtbarkeitsbereich"
        label: "Visibility Range"
        items:
          - {command: "beschriftung_massstab_max", size: "medium"}
          - {command: "beschriftung_massstab_min", size: "medium"}
          - {command: "beschriftung_massstab_aus", size: "medium"}
      - id: "textsymbol"
        label: "Text Symbol"
        launcher: "beschriftungseigenschaften"
        items:
          - menu: "Text Format"
            key: "Textformat"
            icon: "/propertyicons/labelformatting.svg"
            gallery: "textformat_galerie"
            items: ["stilverwaltung"]
            size: "large"
          - row: ["beschriftung_schrift", "beschriftung_groesse", "beschriftung_groesser", "beschriftung_kleiner", "beschriftung_schriftschnitt", "beschriftung_farbe"]
      - id: "platzierung"
        label: "Placement"
        items:
          - {command: "platzierung_galerie", size: "large"}
      - id: "karte"
        label: "Map"
        items:
          - row: ["nicht_platzierte_beschriftungen"]
  - id: "vektor_daten"
    label: "Data"
    context: "Vector Layer"
    visible_when: ["active_layer_is_vector"]
    groups:
      - id: "filter"
        label: "Filter"
        launcher: "quelle_und_filter"
        items:
          - {command: "filter", size: "large"}
      - id: "tabelle"
        label: "Table"
        items:
          - {command: "attributtabelle", size: "large"}
          - {command: "tabelle_der_auswahl", size: "large"}
      - id: "auswahl"
        label: "Selection"
        items:
          - {command: "alle_auswaehlen", size: "medium"}
          - {command: "auswahl_umkehren", size: "medium"}
          - {command: "auswahl_im_layer_aufheben", size: "medium"}
          - {command: "layer_aus_auswahl", size: "large"}
      - id: "datenentwurf"
        label: "Data Design"
        items:
          - {command: "felder", size: "large"}
          - {command: "domaenen", size: "large"}
      - id: "beziehungen"
        label: "Relationships"
        items:
          - {command: "raeumliche_verknuepfung", size: "large"}
          - {command: "verknuepfung_hinzufuegen", size: "large"}
          - {command: "beziehungen_verwalten", size: "large"}
      - id: "exportieren"
        label: "Export"
        items:
          - {command: "objekte_exportieren", size: "large"}
  - id: "tabelle_daten"
    label: "Data"
    context: "Table"
    visible_when: ["active_layer_is_table"]
    groups:
      - id: "filter"
        label: "Filter"
        launcher: "quelle_und_filter"
        items:
          - {command: "filter", size: "large"}
      - id: "tabelle"
        label: "Table"
        items:
          - {command: "attributtabelle", size: "large"}
          - {command: "tabelle_der_auswahl", size: "large"}
      - id: "auswahl"
        label: "Selection"
        items:
          - {command: "nach_attributen", size: "large"}
          - {command: "alle_auswaehlen", size: "medium"}
          - {command: "auswahl_umkehren", size: "medium"}
          - {command: "auswahl_im_layer_aufheben", size: "medium"}
          - {command: "loeschen", size: "medium"}
      - id: "datenentwurf"
        label: "Data Design"
        items:
          - {command: "felder", size: "large"}
          - {command: "domaenen", size: "large"}
      - id: "beziehungen"
        label: "Relationships"
        items:
          - {command: "verknuepfung_hinzufuegen", size: "large"}
          - {command: "beziehungen_verwalten", size: "large"}
      - id: "exportieren"
        label: "Export"
        items:
          - {command: "objekte_exportieren", size: "large"}
      - id: "punkte_erstellen"
        label: "Create Points"
        items:
          - menu: "From Table"
            key: "Aus Tabelle"
            icon: "/mActionAddDelimitedTextLayer.svg"
            items: ["xy_tabelle_zu_punkten", "textdatei_mit_koordinaten"]
            size: "large"
  - id: "raster_darstellung"
    label: "Appearance"
    context: "Raster Layer"
    visible_when: ["active_layer_is_raster"]
    groups:
      - id: "sichtbarkeitsbereich"
        label: "Visibility Range"
        items:
          - {command: "layer_massstab_schalten", size: "large"}
          - {command: "layer_massstab_max", size: "medium"}
          - {command: "layer_massstab_min", size: "medium"}
      - id: "effekte"
        label: "Effects"
        items:
          - {command: "layer_deckkraft", size: "medium"}
          - {command: "layer_mischmodus", size: "medium"}
      - id: "symbolisierung"
        label: "Symbology"
        items:
          - split: "raster_symbolisierung"
            items: ["raster_darstellungsart"]
            size: "large"
          - {command: "histogramm", size: "large"}
          - {command: "streckung_auf_ausschnitt", size: "large"}
          - {command: "raster_resampling", size: "large"}
          - {command: "raster_kanaele", size: "large"}
          - {command: "masken", size: "large"}
      - id: "bildverbesserung"
        label: "Enhancement"
        items:
          - {command: "raster_helligkeit", size: "medium"}
          - {command: "raster_kontrast", size: "medium"}
          - {command: "raster_gamma", size: "medium"}

commands:
  einfuegen:
    label: "Paste"
    source: {type: "qgis_action", object_name: "mActionPasteFeatures"}
    description: "Paste features from the clipboard into the active layer."
  einfuegen_als:
    label: "Paste As"
    source: {type: "qgis_menu", object_name: "mMenuPasteAs"}
    description: "Paste copied features as a new or temporary layer."
  stil_einfuegen:
    label: "Paste Style"
    source: {type: "qgis_action", object_name: "mActionPasteStyle"}
    description: "Apply the copied style to the active layer."
  ausschneiden:
    label: "Cut"
    source: {type: "qgis_action", object_name: "mActionCutFeatures"}
    description: "Cut the selected features."
  kopieren:
    label: "Copy"
    source: {type: "qgis_action", object_name: "mActionCopyFeatures"}
    description: "Copy the selected features to the clipboard."
  pfad_kopieren:
    label: "Copy Path"
    source: {type: "custom", id: "ribbon.layerpfad_kopieren"}
    icon: "/mActionEditCopy.svg"
    description: "Copy the data source of the active layer to the clipboard as text."
  erkunden:
    label: "Explore"
    source: {type: "qgis_action", object_name: "mActionPan"}
    description: "Pan the map by dragging."
  abfrage_oberster_layer:
    label: "Identify: Top Layer"
    source:
      type: "custom"
      args: ["TopDownStopAtFirst"]
      id: "ribbon.abfragemodus"
    icon: "/mActionIdentify.svg"
    description: "Select the identify tool; only the topmost layer with a hit is queried."
  abfrage_sichtbare_layer:
    label: "Identify: Visible Layers"
    source:
      type: "custom"
      args: ["TopDownAll"]
      id: "ribbon.abfragemodus"
    icon: "/mActionIdentify.svg"
    description: "Select the identify tool; all visible layers are queried."
  abfragbare_layer:
    label: "Identifiable Layers"
    source: {type: "custom", id: "ribbon.abfragbare_layer"}
    kind: "control"
    icon: "/mActionIdentify.svg"
    description: "Choose which layers the identify tool considers; switches identify to all identifiable layers."
    gallery: {display: "dropdown"}
  abfrage_aktueller_layer:
    label: "Identify: Current Layer"
    source:
      type: "custom"
      args: ["ActiveLayer"]
      id: "ribbon.abfragemodus"
    icon: "/mActionIdentify.svg"
    description: "Select the identify tool; only the active layer is queried."
  volle_ausdehnung:
    label: "Full Extent"
    source: {type: "qgis_action", object_name: "mActionZoomFullExtent"}
    description: "Zoom to the extent of all layers."
  zur_auswahl_zoomen:
    label: "Zoom to Selection"
    source: {type: "qgis_action", object_name: "mActionZoomToSelected"}
    description: "Zoom to the selected features."
  schrittweise_hineinzoomen:
    label: "Step Zoom In"
    source: {type: "iface_method", method: "mapCanvas.zoomIn"}
    icon: "/mActionZoomIn.svg"
    description: "Zoom in one step around the map center."
  schrittweise_herauszoomen:
    label: "Step Zoom Out"
    source: {type: "iface_method", method: "mapCanvas.zoomOut"}
    icon: "/mActionZoomOut.svg"
    description: "Zoom out one step around the map center."
  vorherige_ausdehnung:
    label: "Previous Extent"
    source: {type: "qgis_action", object_name: "mActionZoomLast"}
    description: "Return to the previous map extent."
  naechste_ausdehnung:
    label: "Next Extent"
    source: {type: "qgis_action", object_name: "mActionZoomNext"}
    description: "Go to the next map extent."
  neues_lesezeichen:
    label: "New Bookmark"
    source: {type: "qgis_action", object_name: "mActionNewBookmark"}
    description: "Save the current map extent as a bookmark."
  lesezeichen_verwalten:
    label: "Manage Bookmarks"
    source: {type: "qgis_action", object_name: "mActionShowBookmarkManager"}
    description: "Show, edit, import and export bookmarks."
  lesezeichen_galerie:
    label: "Bookmarks"
    source: {type: "custom", id: "ribbon.lesezeichen_galerie"}
    kind: "control"
    icon: "/mActionShowBookmarks.svg"
    description: "Jump to the project's saved bookmarks and your own bookmarks."
    gallery: {display: "dropdown"}
  gehe_zu_xy:
    label: "Go To XY"
    source:
      type: "custom"
      args: ["go "]
      id: "ribbon.locator_fokus"
    icon: "/mActionZoomTo.svg"
    description: "Enter a coordinate in the locator bar and jump there."
  optionen_kartenwerkzeuge:
    label: "Map Tool Options"
    source:
      type: "iface_method"
      args: [null, "mOptionsPageMapTools"]
      method: "showOptionsDialog"
    description: "Open the options for zooming, identifying and measuring."
  grundkarte_basemap_de_farbig:
    label: "basemap.de color"
    source:
      type: "custom"
      args: ["https://sgx.geodatenzentrum.de/wmts_basemapde/tile/1.0.0/de_basemapde_web_raster_farbe/default/GLOBAL_WEBMERCATOR/{z}/{y}/{x}.png", 0, 18, "© GeoBasis-DE / BKG, CC BY 4.0"]
      id: "ribbon.grundkarte"
    icon: "/mIconXyz.svg"
    description: "Official basemap of Germany (BKG), color. License CC BY 4.0."
  grundkarte_basemap_de_grau:
    label: "basemap.de gray"
    source:
      type: "custom"
      args: ["https://sgx.geodatenzentrum.de/wmts_basemapde/tile/1.0.0/de_basemapde_web_raster_grau/default/GLOBAL_WEBMERCATOR/{z}/{y}/{x}.png", 0, 18, "© GeoBasis-DE / BKG, CC BY 4.0"]
      id: "ribbon.grundkarte"
    icon: "/mIconXyz.svg"
    description: "Official basemap of Germany (BKG), grayscale. License CC BY 4.0."
  grundkarte_opentopomap:
